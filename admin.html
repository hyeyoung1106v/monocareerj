<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MONOCAREER 관리자</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .login-box h1 {
      margin: 0 0 10px;
      text-align: center;
    }

    .login-box p {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 6px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .error {
      color: #d33;
      text-align: center;
      margin-top: 15px;
      display: none;
    }

    .dashboard {
      display: none;
      min-height: 100vh;
    }

    .header {
      background: #222;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .logout {
      width: auto;
      padding: 8px 15px;
      background: white;
      color: #222;
    }

    .content {
      padding: 30px;
      max-width: 1200px;
      margin: auto;
    }

    .content h2 {
      margin-top: 0;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .menu-card {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
      cursor: pointer;
    }

    .menu-card h3 {
      margin-top: 0;
    }

    .menu-card p {
      color: #777;
      margin-bottom: 0;
    }
  </style>
</head>

<body>

  <!-- 관리자 로그인 -->
  <div class="login-container" id="loginPage">
    <div class="login-box">

      <h1>MONOCAREER</h1>
      <p>관리자 로그인</p>

      <label for="username">아이디</label>
      <input type="text" id="username" placeholder="관리자 아이디">

      <label for="password">비밀번호</label>
      <input type="password" id="password" placeholder="비밀번호">

      <button onclick="login()">로그인</button>

      <div class="error" id="errorMessage">
        아이디 또는 비밀번호를 확인해주세요.
      </div>

    </div>
  </div>


  <!-- 관리자 대시보드 -->
  <div class="dashboard" id="dashboard">

    <header class="header">
      <h1>MONOCAREER 관리자</h1>
      <button class="logout" onclick="logout()">로그아웃</button>
    </header>

    <main class="content">

      <h2>관리자 대시보드</h2>

      <div class="menu">

        <div class="menu-card">
          <h3>구인공고 관리</h3>
          <p>구인공고 등록 및 수정·삭제</p>
        </div>

        <div class="menu-card">
          <h3>구직자 관리</h3>
          <p>구직자 정보를 관리합니다.</p>
        </div>

        <div class="menu-card">
          <h3>기업 관리</h3>
          <p>등록 기업 정보를 관리합니다.</p>
        </div>

        <div class="menu-card">
          <h3>문의 관리</h3>
          <p>홈페이지 문의 내용을 확인합니다.</p>
        </div>

      </div>

    </main>

  </div>


  <script>
    function login() {

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const errorMessage = document.getElementById("errorMessage");

      /*
        임시 테스트용 로그인입니다.

        실제 서비스에서는 이 방식으로 비밀번호를
        저장하면 안 됩니다.

        추후 서버 인증을 연결해야 합니다.
      */

      if (username === "admin" && password === "1234") {

        document.getElementById("loginPage").style.display = "none";
        document.getElementById("dashboard").style.display = "block";

      } else {

        errorMessage.style.display = "block";

      }
    }

    function logout() {

      document.getElementById("dashboard").style.display = "none";
      document.getElementById("loginPage").style.display = "flex";

      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
    }
  </script>

</body>
</html>
