<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MONO CAREER J</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <a class="brand" href="#">
      <span class="logo" aria-hidden="true"><i></i><b></b></span>
      <span>MONO CAREER J</span>
    </a>

    <div class="header-right">
      <div class="languages">
        <button class="lang active">한국어</button>
        <span>|</span>
        <button class="lang">日本語</button>
      </div>
      <button class="menu-button" id="menuButton" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-inner">
        <div class="eyebrow"><span></span>한·일 채용 컨설팅</div>

        <div class="switcher">
          <button class="switch active" data-target="jobs">일자리 찾기</button>
          <button class="switch" data-target="talent">인재 찾기</button>
        </div>

        <h1>한국과 일본을 잇는<br />커리어 파트너</h1>
        <p class="hero-copy">지원서 한 장으로 전문 컨설턴트와 상담을 시작하세요.</p>

        <button class="cta" id="jobButton">채용공고 보기</button>

        <div class="arc-art" aria-hidden="true">
          <div class="arc"></div>
          <div class="arc-grid"></div>
          <div class="arc-dot"></div>
          <div class="arc-line"></div>
        </div>
      </div>
    </section>

    <section class="jobs-section" id="jobsSection">
      <div class="section-heading">
        <h2>모집 중인 공고</h2>
        <a href="#" id="allJobs">전체 보기 <span>→</span></a>
      </div>
      <p class="empty">현재 모집 중인 공고가 없습니다.</p>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <div class="footer-logo">
          <span class="logo light"><i></i><b></b></span>
          <span>MONO CAREER J</span>
        </div>
        <p>일본·국내 기업 채용 정보와 커리어 상담</p>
      </div>

      <nav class="footer-links">
        <a href="#">개인정보처리방침</a>
        <a href="#">이용약관</a>
      </nav>

      <div class="company-info">
        <p>모노커리어제이</p>
        <p>대표이사 (확인 필요)</p>
        <p>사업자등록번호 000-00-00000</p>
        <p>직업소개사업 등록번호 (확인 필요)</p>
      </div>

      <p class="copyright">© Mono Career J</p>
    </div>
  </footer>

  <div class="drawer" id="drawer" aria-hidden="true">
    <button class="drawer-close" id="drawerClose">×</button>
    <a href="#jobsSection">채용공고</a>
    <a href="#">회사소개</a>
    <a href="#">커리어 상담</a>
    <a href="#">문의하기</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
